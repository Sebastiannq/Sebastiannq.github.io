<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wallet Gasticos - Apple Pay Concept</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="page">
    <div class="card">
      <!-- Cabecera de la Tarjeta -->
      <div class="card-top">
        <div class="wallet-address">
          <span></span>
          <span>Sebastian's pay</span>
        </div>
        <div class="top-icons">
        </div>
      </div>

      <!-- FORMULARIO DE GASTOS -->
      <form id="gastoForm">

        <!-- Monto gigante estilo Balance -->
        <div class="form-group monto-group">
          <label class="label" for="monto">Monto del Gasto</label>
          <input type="number" id="monto" class="input-monto" placeholder="$0.00" step="any" required inputmode="decimal">
        </div>

        <!-- Fecha -->
        <div class="form-group">
          <input type="date" id="fecha" class="input-standard" required>
        </div>

        <!-- Método de pago -->
        <div class="form-group">
          <select id="metodoPago" class="input-standard" required>
            <option value="" disabled selected>Método de pago...</option>
            <option value="Efectivo">Efectivo</option>
            <option value="Tarjeta débito">Tarjeta débito</option>
            <!--<option value="Tarjeta crédito"8>Tarjeta crédito</option>-->
            <option value="Nequi/Daviplata">Transferencia</option>
          </select>
        </div>

        <!-- Categoría -->
        <div class="form-group">
          <select id="categoria" class="input-standard" required>
            <option value="" disabled selected>Selecciona una categoría...</option>
            <option value="Comida">Comida</option>
            <option value="Lujitos">Lujitos</option>
            <option value="Juegos">Juegos</option>
            <option value="Viajes/uber">Viajes/uber</option>
            <option value="Deudas">Deudas</option>
            <option value="Ropa">Ropa</option>
            <option value="Set up">Set up</option>
          </select>
        </div>

        <!-- Botón de Envío -->
        <button type="submit" id="btnEnviar" class="btn-submit">
          Registrar Movimiento
        </button>

      </form>
    </div>

    <!-- Logo Inferior -->
    <div class="brand">
      <div class="brand-logo">
        <span></span>
      </div>
      <div class="brand-sub">GASTICOS</div>
    </div>
  </div>

  <!-- Script interactivo -->
  <script>
    // Precarga la fecha de hoy al cargar la página
    const fechaInput = document.getElementById('fecha');
    if (fechaInput) {
      fechaInput.value = new Date().toISOString().split('T')[0];
    }

    document.getElementById('gastoForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const btn = document.getElementById('btnEnviar');

        // 1. Capturar los valores de los inputs
        const monto = document.getElementById('monto').value;
        const fecha = document.getElementById('fecha').value;
        const metodoPago = document.getElementById('metodoPago').value;
        const categoria = document.getElementById('categoria').value;

        // Estado de carga para que se vea interactivo
        btn.textContent = "Enviando...";

        try {
            // 2. URL del webhook de Make.com
            const webhookUrl = 'https://hook.us2.make.com/76xlp7ubhgc83zy9mjk80bumbhgfoam9';

            // 3. Petición POST para enviar los datos a Make -> Notion
            await fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    monto: Number(monto),
                    fecha: fecha,
                    metodo_pago: metodoPago,
                    categoria: categoria
                })
            });

            // 4. Animación de éxito estilo Apple
            btn.textContent = "¡Aprobado!";
            btn.classList.add('success');

            // 5. Resetear el formulario después de 2 segundos
            setTimeout(() => {
                btn.textContent = "Registrar Movimiento";
                btn.classList.remove('success');
                document.getElementById('gastoForm').reset();
                // Volver a poner la fecha de hoy
                fechaInput.value = new Date().toISOString().split('T')[0];
            }, 2000);

        } catch (error) {
            console.error("Error al enviar el gasto:", error);
            btn.textContent = "Error de conexión ❌";
            setTimeout(() => {
                btn.textContent = "Registrar Movimiento";
            }, 2000);
        }
    });
  </script>

</body>
</html>
